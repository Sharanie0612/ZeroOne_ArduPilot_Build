name: ArduPilot Cloud Build
run-name: "[${{ inputs.source_repository }}|${{ inputs.board }}|${{ inputs.vehicle }}|${{ inputs.source_ref }}|${{ inputs.source_sha }}|${{ inputs.board_package_sha || 'base' }}] ${{ inputs.build_date }} · ${{ inputs.requester }}"

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Public GitHub source repository (owner/name)
        required: true
        default: Sharanie0612/ardupilot
        type: string
      source_ref:
        description: ArduPilot source branch or tag
        required: true
        default: master
        type: string
      source_sha:
        description: Exact ArduPilot source commit (set by the desktop app)
        required: false
        default: ''
        type: string
      vehicle:
        description: Vehicle firmware
        required: true
        default: copter
        type: choice
        options:
          - copter
          - plane
          - rover
          - sub
          - antennatracker
          - blimp
      board:
        description: ZeroOne hardware board name
        required: true
        default: ZeroOneX6
        type: string
      build_date:
        description: Requirement date (YYYY-MM-DD)
        required: true
        type: string
      requester:
        description: Requester name
        required: true
        type: string
      clean:
        description: Clean the build directory first
        required: true
        default: false
        type: boolean
      board_package_b64:
        description: Beta hwdef ZIP encoded as base64 (set by OneIDE)
        required: false
        default: ''
        type: string
      board_package_sha:
        description: SHA256 of the normalized Beta hwdef ZIP
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ardupilot-${{ inputs.source_repository }}-${{ inputs.source_sha || inputs.source_ref }}-${{ inputs.vehicle }}-${{ inputs.board }}-${{ inputs.board_package_sha || 'base' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Validate inputs
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          BUILD_DATE: ${{ inputs.build_date }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BOARD_PACKAGE_B64: ${{ inputs.board_package_b64 }}
          BOARD_PACKAGE_SHA: ${{ inputs.board_package_sha }}
        run: |
          if [[ ! "$BOARD" =~ ^ZeroOne[A-Za-z0-9._+-]{1,72}$ ]]; then
            echo "Invalid board name: $BOARD" >&2
            exit 2
          fi
          if [[ ! "$BUILD_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid build date: $BUILD_DATE" >&2
            exit 2
          fi
          if [[ ! "$SOURCE_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]{0,199}$ ]]; then
            echo "Invalid source ref: $SOURCE_REF" >&2
            exit 2
          fi
          if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid public GitHub source repository: $SOURCE_REPOSITORY" >&2
            exit 2
          fi
          if [[ -n "$SOURCE_SHA" && ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 2
          fi
          if [[ -n "$BOARD_PACKAGE_B64" && ! "$BOARD_PACKAGE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "A valid board package SHA is required with the Beta package" >&2
            exit 2
          fi
          if [[ -z "$BOARD_PACKAGE_B64" && -n "$BOARD_PACKAGE_SHA" ]]; then
            echo "Board package content is missing" >&2
            exit 2
          fi
          if [[ -z "$BOARD_PACKAGE_B64" ]]; then
            case "$BOARD" in
              ZeroOneX6|ZeroOneX6_Air|ZeroOneX6-ODID) ;;
              *) echo "A custom ZeroOne board requires a Beta board package: $BOARD" >&2; exit 2 ;;
            esac
          fi

      - name: Check out ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_sha || inputs.source_ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Inject Beta ZeroOne board package
        if: ${{ inputs.board_package_b64 != '' }}
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          BOARD_PACKAGE_B64: ${{ inputs.board_package_b64 }}
          BOARD_PACKAGE_SHA: ${{ inputs.board_package_sha }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64, hashlib, io, os, pathlib, stat, zipfile

          raw = base64.b64decode(os.environ["BOARD_PACKAGE_B64"], validate=True)
          if len(raw) > 40 * 1024 or hashlib.sha256(raw).hexdigest() != os.environ["BOARD_PACKAGE_SHA"]:
              raise SystemExit("Invalid Beta board package size or checksum")
          board = os.environ["BOARD"]
          destination = pathlib.Path("libraries/AP_HAL_ChibiOS/hwdef")
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              files = [item for item in archive.infolist() if not item.is_dir()]
              if not files or len(files) > 40 or sum(item.file_size for item in files) > 1024 * 1024:
                  raise SystemExit("Invalid Beta board package contents")
              for item in files:
                  parts = pathlib.PurePosixPath(item.filename).parts
                  if not parts or parts[0] != board or any(part in {"", ".", ".."} for part in parts):
                      raise SystemExit("Unsafe path in Beta board package")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise SystemExit("Symlinks are not allowed in Beta board package")
                  target = destination.joinpath(*parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          if not (destination / board / "hwdef.dat").is_file():
              raise SystemExit("Beta board package does not contain hwdef.dat")
          print(f"Injected Beta board package {os.environ['BOARD_PACKAGE_SHA'][:12]} for {board}")
          PY

      - name: Cache compiler downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/opt
          key: ardupilot-toolchain-${{ inputs.source_repository }}-${{ runner.os }}-${{ hashFiles('Tools/environment_install/install-prereqs-ubuntu.sh') }}
          restore-keys: |
            ardupilot-toolchain-${{ inputs.source_repository }}-${{ runner.os }}-

      - name: Install build prerequisites
        shell: bash
        run: |
          Tools/environment_install/install-prereqs-ubuntu.sh -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/opt/gcc-arm-none-eabi-10-2020-q4-major/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          CLEAN: ${{ inputs.clean }}
        run: |
          source ~/.profile || true
          if [[ "$CLEAN" == "true" ]]; then
            ./waf clean
          fi
          ./waf configure --board "$BOARD"

      - name: Compile firmware
        shell: bash
        env:
          VEHICLE: ${{ inputs.vehicle }}
        run: |
          source ~/.profile || true
          ./waf "$VEHICLE"

      - name: Write build manifest
        if: always()
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          VEHICLE: ${{ inputs.vehicle }}
          BUILD_DATE: ${{ inputs.build_date }}
          REQUESTER: ${{ inputs.requester }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BOARD_PACKAGE_SHA: ${{ inputs.board_package_sha }}
        run: |
          mkdir -p "build/$BOARD"
          {
            echo "repository=${SOURCE_REPOSITORY}"
            echo "commit=$(git rev-parse HEAD)"
            echo "ref=${SOURCE_REF}"
            echo "vehicle=${VEHICLE}"
            echo "board=${BOARD}"
            echo "date=${BUILD_DATE}"
            echo "requester=${REQUESTER}"
            echo "board_package_sha=${BOARD_PACKAGE_SHA:-base}"
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "build/$BOARD/build-info.txt"

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.board }}_${{ inputs.vehicle }}_${{ inputs.build_date }}
          path: |
            build/${{ inputs.board }}/bin/**
            build/${{ inputs.board }}/build-info.txt
          if-no-files-found: error
          retention-days: 30

  notify:
    name: Notify Feishu from clean runner
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Notify Feishu
        if: always()
        shell: bash
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
          BUILD_STATUS: ${{ needs.build.result }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BOARD: ${{ inputs.board }}
          VEHICLE: ${{ inputs.vehicle }}
          BUILD_DATE: ${{ inputs.build_date }}
          REQUESTER: ${{ inputs.requester }}
        run: |
          if [[ -z "$FEISHU_WEBHOOK_URL" ]]; then
            echo "FEISHU_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          /usr/bin/python3 - <<'PY'
          import base64, hashlib, hmac, json, os, time, urllib.request

          status = "成功" if os.environ["BUILD_STATUS"] == "success" else "失败"
          text = (
              f"ArduPilot 固件编译{status}\n"
              f"需求人：{os.environ['REQUESTER']}\n"
              f"源码：{os.environ['SOURCE_REPOSITORY']} · {os.environ['SOURCE_REF']}@{os.environ['SOURCE_SHA'][:7]}\n"
              f"固件：{os.environ['BOARD']}_{os.environ['VEHICLE']}_{os.environ['BUILD_DATE']}\n"
              f"日志：{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          payload = {"msg_type": "text", "content": {"text": text}}
          secret = os.environ.get("FEISHU_SIGNING_SECRET", "")
          if secret:
              timestamp = str(int(time.time()))
              key = f"{timestamp}\n{secret}".encode()
              payload.update(timestamp=timestamp, sign=base64.b64encode(hmac.new(key, digestmod=hashlib.sha256).digest()).decode())
          request = urllib.request.Request(
              os.environ["FEISHU_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode(),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.load(response)
          if result.get("code", result.get("StatusCode", 0)) != 0:
              raise RuntimeError(result)
          PY
